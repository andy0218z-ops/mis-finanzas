<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f97316">
<link rel="manifest" href="manifest.json">
<title>Mis Finanzas</title>
<style>
:root{--orange:#f97316;--bg:#f6f7f9;--card:#fff;--text:#17202a;--muted:#68727d;--line:#e5e7eb;--green:#16834b;--red:#c0392b}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
main{max-width:760px;margin:auto;padding:18px 14px 92px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.top h1{margin:0;font-size:26px}.pill{background:#fff1e8;color:#b94e08;padding:8px 11px;border-radius:999px;font-size:13px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px}.label{color:var(--muted);font-size:12px}.num{font-size:21px;font-weight:800;margin-top:5px;overflow-wrap:anywhere}.section{margin-top:13px}.section h2{font-size:17px;margin:0 0 9px}.form{display:grid;grid-template-columns:1fr 1fr;gap:9px}.full{grid-column:1/-1}label{font-size:12px;color:var(--muted);display:block;margin-bottom:5px}input,select,button{font:inherit}input,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff;font-size:16px}button{border:0;border-radius:12px;padding:12px 15px;background:var(--orange);color:white;font-weight:750;min-height:44px}.secondary{background:#fff3eb;color:#b94e08}.actions{display:flex;gap:8px;flex-wrap:wrap}.budgetbar{height:10px;background:#eceff1;border-radius:20px;overflow:hidden}.budgetfill{height:100%;background:var(--orange);width:0}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.table{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:16px}.table table{width:100%;border-collapse:collapse;font-size:14px}.table th,.table td{text-align:left;padding:11px 10px;border-bottom:1px solid var(--line);white-space:nowrap}.table th{font-size:11px;color:var(--muted)}.income{color:var(--green);font-weight:750}.expense{color:var(--red);font-weight:750}.empty{text-align:center;color:var(--muted);padding:22px}.catrow{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line)}.small{font-size:12px;color:var(--muted)}@media(min-width:650px){.grid{grid-template-columns:repeat(4,1fr)}.form{grid-template-columns:repeat(4,1fr)}.full{grid-column:auto}.form button{grid-column:4}}
</style>
</head>
<body>
<main>
<div class="top"><h1>💰 Mis Finanzas</h1><span class="pill">COP</span></div>

<div class="grid">
<div class="card"><div class="label">Saldo</div><div id="saldo" class="num">$0</div></div>
<div class="card"><div class="label">Ingresos</div><div id="ingresos" class="num">$0</div></div>
<div class="card"><div class="label">Gastos</div><div id="gastos" class="num">$0</div></div>
<div class="card"><div class="label">Ahorro</div><div id="ahorro" class="num">$0</div></div>
</div>

<section class="section card">
<h2>➕ Registrar movimiento</h2>
<div class="form">
<div><label>Tipo</label><select id="tipo"><option value="gasto">Gasto</option><option value="ingreso">Ingreso</option></select></div>
<div><label>Categoría</label><select id="categoria"><option>Alimentación</option><option>Vivienda</option><option>Transporte</option><option>Servicios</option><option>Salud</option><option>Educación</option><option>Deudas</option><option>Ocio</option><option>Compras</option><option>Ahorro</option><option>Otros</option></select></div>
<div><label>Fecha</label><input id="fecha" type="date"></div>
<div><label>Valor (COP)</label><input id="valor" type="number" min="1" step="1000" placeholder="0"></div>
<div class="full"><label>Concepto</label><input id="concepto" maxlength="80" placeholder="Ej. Mercado, arriendo, nómina..."></div>
<button id="add" class="full">Agregar movimiento</button>
</div>
</section>

<section class="section card">
<div class="row"><div><h2>🎯 Presupuesto mensual</h2><div id="budgetText" class="small">No definido</div></div><button id="budget" class="secondary">Definir</button></div>
<div style="margin-top:12px" class="budgetbar"><div id="budgetFill" class="budgetfill"></div></div>
</section>

<section class="section card">
<div class="row"><h2>📊 Gastos por categoría</h2><span id="monthLabel" class="small"></span></div>
<div id="cats"></div>
</section>

<section class="section">
<div class="row"><h2>🧾 Movimientos</h2><button id="clear" class="secondary">Borrar</button></div>
<div class="table"><table><thead><tr><th>Fecha</th><th>Categoría</th><th>Concepto</th><th>Valor</th></tr></thead><tbody id="rows"></tbody></table></div>
</section>

<section class="section card">
<h2>📱 Instalar en iPhone</h2>
<div class="small">Abre esta app desde Safari, toca Compartir y selecciona “Añadir a pantalla de inicio”.</div>
</section>
</main>

<script>
const KEY="mis-finanzas-v1";let state=JSON.parse(localStorage.getItem(KEY)||'{"moves":[],"budget":0}');
const $=id=>document.getElementById(id);
const money=n=>new Intl.NumberFormat("es-CO",{style:"currency",currency:"COP",maximumFractionDigits:0}).format(n||0);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const d=new Date(), today=new Date(d-d.getTimezoneOffset()*60000).toISOString().slice(0,10);$("fecha").value=today;
function save(){localStorage.setItem(KEY,JSON.stringify(state));render()}
function render(){
 const inc=state.moves.filter(x=>x.type==="ingreso").reduce((a,x)=>a+x.value,0);
 const exp=state.moves.filter(x=>x.type==="gasto").reduce((a,x)=>a+x.value,0);
 $("saldo").textContent=money(inc-exp);$("ingresos").textContent=money(inc);$("gastos").textContent=money(exp);$("ahorro").textContent=money(Math.max(0,inc-exp));
 $("budgetText").textContent=state.budget?`Gastado ${money(exp)} de ${money(state.budget)}`:"No definido";
 $("budgetFill").style.width=(state.budget?Math.min(100,exp/state.budget*100):0)+"%";
 $("monthLabel").textContent=d.toLocaleDateString("es-CO",{month:"long",year:"numeric"});
 let cats={};state.moves.filter(x=>x.type==="gasto").forEach(x=>cats[x.cat]=(cats[x.cat]||0)+x.value);
 $("cats").innerHTML=Object.entries(cats).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="catrow"><span>${esc(k)}</span><strong>${money(v)}</strong></div>`).join("")||'<div class="empty">Aún no hay gastos.</div>';
 $("rows").innerHTML=state.moves.slice().reverse().map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.cat)}</td><td>${esc(x.concept)}</td><td class="${x.type==="ingreso"?"income":"expense"}">${x.type==="ingreso"?"+":"−"}${money(x.value)}</td></tr>`).join("")||'<tr><td colspan="4" class="empty">No hay movimientos registrados.</td></tr>';
}
$("add").onclick=()=>{let v=Number($("valor").value),c=$("concepto").value.trim();if(!v||v<1||!c){alert("Completa concepto y valor.");return}state.moves.push({type:$("tipo").value,cat:$("categoria").value,date:$("fecha").value,concept:c,value:v});$("valor").value="";$("concepto").value="";save()};
$("budget").onclick=()=>{let v=prompt("Presupuesto mensual en COP:",state.budget||"");if(v!==null){v=Number(v.replace(/[^0-9]/g,""));if(Number.isFinite(v)&&v>=0){state.budget=v;save()}}};
$("clear").onclick=()=>{if(confirm("¿Borrar todos los movimientos y presupuesto?")){state={moves:[],budget:0};save()}};
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
render();
</script>
</body></html>
